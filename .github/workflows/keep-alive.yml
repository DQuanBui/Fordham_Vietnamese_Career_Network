name: Keep database awake

# Free Supabase projects pause after a week without activity.
# A tiny read every three days keeps the live site's database available.
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' js/config.js)
          KEY=$(sed -n 's/.*supabaseAnonKey: *"\([^"]*\)".*/\1/p' js/config.js)
          if [ -z "$URL" ]; then
            echo "js/config.js has no Supabase URL (demo mode); nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 \
            "$URL/rest/v1/majors?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase responded; project is active."
